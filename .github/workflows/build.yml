name: Compilar mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Extrair o projeto
        run: |
          unzip -o projeto.zip -d proj
          ls -la proj

      - name: Compilar
        run: |
          DIR=$(dirname "$(find proj -name settings.gradle | head -n 1)")
          cd "$DIR"
          gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: alquimialab-jar
          path: proj/**/build/libs/*.jar

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: proj/**/build/libs/*.jar
