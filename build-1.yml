          FIM_DO_ARQUIVO
          mkdir -p proj
          unzip -o proj.zip -d proj
          echo "--- conteudo extraido ---"
          ls -la proj
          find proj -name settings.gradle

      - name: Compilar
        run: |
          DIR=$(dirname "$(find proj -name settings.gradle | head -n 1)")
          echo "Projeto em: $DIR"
          cd "$DIR"
          gradle build --no-daemon

      - name: Guardar o jar
        uses: actions/upload-artifact@v4
        with:
          name: alquimialab-jar
          path: proj/**/build/libs/*.jar

      - name: Publicar o jar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Alquimia Lab build ${{ github.run_number }}
          files: proj/**/build/libs/*.jar
